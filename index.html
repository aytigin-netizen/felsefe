<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Felsefe, Sosyoloji, Psikoloji ve Mantık öğretmenleri için yıllık plan, günlük plan, ünite planı, çalışma kâğıdı ve rubrik üretim araçları. Veriler MEB Türkiye Yüzyılı Maarif Modeli 2026 programlarından alınmıştır." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Sosyal Bilimler Öğretmen Araçları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" aria-label="Modül gezinmesi"></aside>

    <div class="app-main">
      <header class="site-header">
        <h1>Sosyal Bilimler Öğretmen Araçları</h1>
        <p class="site-alt">Felsefe · Sosyoloji · Psikoloji · Mantık — Türkiye Yüzyılı Maarif Modeli 2026</p>
      </header>

      <main class="sayfa-icerik">
        <section class="secim-alani" aria-label="Ders ve sınıf düzeyi seçimi">
          <div class="secim-satiri">
            <label for="ders-secim">Ders</label>
            <select id="ders-secim" aria-label="Ders seçin"></select>
          </div>
          <div class="secim-satiri">
            <label for="seviye-secim" id="seviye-secim-label" hidden>Sınıf / Ders Düzeyi</label>
            <select id="seviye-secim" aria-label="Sınıf veya ders düzeyi seçin" hidden></select>
          </div>
        </section>

        <p id="yukleniyor" hidden role="status">Veri yükleniyor…</p>
        <p id="hata-alani" class="hata" hidden role="alert"></p>
        <p id="cerceve-plan-uyari" class="uyari" hidden role="status"></p>

        <section aria-label="Çıktı modülleri">
          <h2 class="gorunmez-baslik">Modüller</h2>
          <div id="modul-grid" class="modul-grid"></div>
        </section>

        <section id="kazanim-onizleme" aria-label="Seçili ders için kazanım önizlemesi"></sec
tion>
      </main>

      <footer class="site-footer">
        <p>Kazanım ve yıllık plan verileri MEB'in resmi 2026 öğretim programı ve 2026-2027 çerçeve yıllık planlarından alınmıştır.</p>
      </footer>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
