<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Sosyal Bilimler Öğretmen Araçları</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Sosyal Bilimler Öğretmen Araçları</h1>
    <p class="site-alt">Felsefe · Sosyoloji · Psikoloji · Mantık — Türkiye Yüzyılı Maarif Modeli 2026</p>
  </header>

  <main>
    <section class="secim-alani" aria-label="Ders ve sınıf düzeyi seçimi">
      <div class="secim-satiri">
        <label for="ders-secim">Ders</label>
        <select id="ders-secim" aria-label="Ders seçin"></select>
      </div>
      <div class="secim-satiri">
        <label for="seviye-secim" id="seviye-secim-label" hidden>Sınıf / Ders Düzeyi</label>
        <select id="seviye-secim" aria-label="Sınıf veya ders düzeyi seçin" hidden></select>
      </div>
    </section>

    <p id="yukleniyor" hidden role="status">Veri yükleniyor…</p>
    <p id="hata-alani" class="hata" hidden role="alert"></p>
    <p id="cerceve-plan-uyari" class="uyari" hidden role="status"></p>

    <section aria-label="Çıktı modülleri">
      <h2 class="gorunmez-baslik">Modüller</h2>
      <div id="modul-grid" class="modul-grid"></div>
    </section>

    <section id="modul-icerik" aria-label="Seçili modülün çıktısı" class="modul-icerik"></section>

    <section id="kazanim-onizleme" aria-label="Seçili ders için kazanım önizlemesi"></section>
  </main>

  <footer class="site-footer">
    <p>Kazanım ve yıllık plan verileri MEB'in resmi 2026 öğretim programı ve 2026-2027 çerçeve yıllık planlarından alınmıştır.</p>
  </footer>

  <script src="js/data-loader.js"></script>
  <script src="js/belge-bilgisi.js"></script>
  <script src="js/modules/yillik-plan.js"></script>
  <script src="js/modules/unite-plani.js"></script>
  <script src="js/modules/calisma-kagidi.js"></script>
  <script src="js/modules/degerlendirme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
